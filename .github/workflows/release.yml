name: macOS release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show build environment
        run: |
          sw_vers
          uname -m
          xcrun --find swiftc
          xcrun swiftc --version

      - name: Build and run checks
        env:
          LUMA_BUILD_DIR: ${{ runner.temp }}/luma-build
          LUMA_RAW_FIXTURE: ${{ github.workspace }}/Samples/synthetic-bayer.dng
        run: bash scripts/build.sh --check

      - name: Verify release version, architecture and signature
        run: |
          python3 scripts/check-release.py "$GITHUB_REF_NAME"
          test "$(lipo -archs 'Luma RAW.app/Contents/MacOS/LumaRAW')" = "arm64"
          test "$(lipo -archs 'Luma RAW.app/Contents/Frameworks/libLumaCore.dylib')" = "arm64"
          codesign --verify --deep --strict "Luma RAW.app"

      - name: Package application
        run: |
          asset="LumaRAW-${GITHUB_REF_NAME}-macos-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "Luma RAW.app" "$asset"
          shasum -a 256 "$asset"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="LumaRAW-${GITHUB_REF_NAME}-macos-arm64.zip"
          gh release create "$GITHUB_REF_NAME" "$asset" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Luma RAW $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
