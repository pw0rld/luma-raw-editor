name: macOS build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    # macos-14 is entering GitHub's deprecation/brownout window.
    # macos-15 is the current Apple Silicon image used by this project.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show build environment
        run: |
          sw_vers
          uname -m
          xcrun --find swiftc
          xcrun swiftc --version
      - name: Build and run checks
        env:
          LUMA_BUILD_DIR: ${{ runner.temp }}/luma-build
          LUMA_RAW_FIXTURE: ${{ github.workspace }}/Samples/synthetic-bayer.dng
        run: bash scripts/build.sh --check
      - name: Package application
        run: ditto -c -k --sequesterRsrc --keepParent "Luma RAW.app" LumaRAW-macos.zip
      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumaRAW-macos
          path: LumaRAW-macos.zip
          if-no-files-found: error
